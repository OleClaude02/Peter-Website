<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik – Peter Kinkelin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    --bg: #1B1E21;
    --text: #F1F2F3;
    --text-soft: #8A9095;
    --nav: #9AA0A5;
    --line: #2C3134;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
  }
  .name { font-family: 'Cormorant Garamond', Georgia, serif; }

  nav {
    display: flex;
    justify-content: center;
    gap: 56px;
    padding: 28px 0;
    font-size: 14px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }
  nav a { color: var(--nav); text-decoration: none; }
  nav a:hover, nav a.active { color: var(--text); }

  h1 {
    text-align: center;
    margin: 40px 0 0;
    font-size: 40px;
    font-weight: 500;
  }
  .subtitle {
    text-align: center;
    margin-top: 8px;
    font-size: 14px;
    color: var(--text-soft);
    letter-spacing: 0.5px;
  }

  .tracks {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .track {
    border-top: 1px solid var(--line);
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .track:last-child { border-bottom: 1px solid var(--line); }
  .track-title {
    font-size: 24px;
    font-weight: 500;
  }
  audio { width: 100%; }
</style>
</head>
<body>

<nav>
  <a href="Peter.html">Peter</a>
  <a href="Bilder.html">Bilder</a>
  <a href="Musik.html" class="active">Musik</a>
</nav>

<h1 class="name">Musik</h1>
<div class="subtitle">Musik von Pete</div>

<div class="tracks">
  <div class="track">
    <div class="track-title name">Spiegelbild</div>
    <audio controls preload="none">
      <source src="assets/spiegelbild.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="track">
    <div class="track-title name">Highlife</div>
    <audio controls preload="none">
      <source src="assets/highlife.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="track">
    <div class="track-title name">Fly (feat. Jessy)</div>
    <audio controls preload="none">
      <source src="assets/fly.mp3" type="audio/mpeg">
    </audio>
  </div>
</div>

</body>
</html>
