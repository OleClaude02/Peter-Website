<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik – Peter Kinkelin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    --bg: #1B1E21;
    --text: #F1F2F3;
    --text-soft: #8A9095;
    --nav: #9AA0A5;
    --line: #2C3134;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
  }
  .name { font-family: 'Cormorant Garamond', Georgia, serif; }

  .bg-photo {
    position: fixed;
    top: 77px;
    left: 50%;
    transform: translateX(-50%);
    width: min(100vw, calc((100vh - 77px) * 1.19));
    aspect-ratio: 1124 / 944;
    z-index: -1;
    pointer-events: none;
    background: url('assets/musik-hintergrund.jpg') center / 100% 100% no-repeat;
    opacity: 0.45;
    mix-blend-mode: lighten;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent), linear-gradient(to top, transparent, #000 10%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent), linear-gradient(to top, transparent, #000 10%);
    mask-composite: intersect;
  }
  @media (max-width: 700px) {
    .bg-photo {
      left: 0;
      right: 0;
      bottom: 0;
      transform: none;
      width: auto;
      aspect-ratio: auto;
      background-size: auto 100%;
      background-position: 12% center;
      -webkit-mask-image: none;
      mask-image: none;
    }
  }

  nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 56px;
    height: 77px;
    font-size: 14px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }
  nav a { color: var(--nav); text-decoration: none; }
  nav a:hover, nav a.active { color: var(--text); }

  h1 {
    text-align: center;
    margin: clamp(12px, 2.5vh, 28px) 0 0;
    font-size: 36px;
    font-weight: 500;
  }
  .subtitle {
    text-align: center;
    margin-top: 4px;
    font-size: 14px;
    color: var(--text-soft);
    letter-spacing: 0.5px;
  }

  .tracks {
    max-width: 900px;
    margin: 0 auto;
    padding: clamp(10px, 2vh, 24px) 24px 24px;
  }
  .track {
    border-top: 1px solid var(--line);
    padding: clamp(6px, 1.3vh, 14px) 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .track:last-child { border-bottom: 1px solid var(--line); }
  .track-title {
    font-size: clamp(18px, 2.6vh, 22px);
    font-weight: 500;
  }
  audio { width: 100%; height: 38px; }
</style>
</head>
<body>

<div class="bg-photo" aria-hidden="true"></div>

<nav>
  <a href="index.html">Peter</a>
  <a href="Bilder.html">Bilder</a>
  <a href="Musik.html" class="active">Musik</a>
</nav>

<h1 class="name">Musik</h1>
<div class="subtitle">Musik von Pete</div>

<div class="tracks">
  <div class="track">
    <div class="track-title name">Spiegelbild - Pete</div>
    <audio controls preload="none">
      <source src="assets/spiegelbild.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="track">
    <div class="track-title name">Highlife - Pete</div>
    <audio controls preload="none">
      <source src="assets/highlife.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="track">
    <div class="track-title name">vile. & DIIRO - Fly (feat. Jessy)</div>
    <audio controls preload="none">
      <source src="assets/fly.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="track">
    <div class="track-title name">Smoke a Cigarette - Pete</div>
    <audio controls preload="none">
      <source src="assets/smoke-a-cigarette.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="track">
    <div class="track-title name">Bleib bei mir, Herr (EG 488)</div>
    <audio controls preload="none"></audio>
  </div>
</div>

<script src="assets/site.js"></script>
</body>
</html>
