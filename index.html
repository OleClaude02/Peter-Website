<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peter Kinkelin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    --bg: #1B1E21;
    --text: #F5F6F6;
    --text-soft: #D9DBDC;
    --nav: #A9AFB4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
  }
  .name { font-family: 'Cormorant Garamond', Georgia, serif; }

  nav {
    display: flex;
    justify-content: center;
    gap: 56px;
    padding: 28px 0;
    font-size: 14px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }
  nav a {
    color: var(--nav);
    text-decoration: none;
  }
  nav a:hover, nav a.active { color: var(--text); }

  .hero {
    position: relative;
    min-height: calc(100vh - 84px);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
    text-align: center;
    padding: 40px 24px 72px;
  }
  .hero img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.92;
    filter: grayscale(10%) contrast(1.02);
  }
  .hero .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(18,20,22,0.05) 0%, rgba(18,20,22,0.12) 55%, rgba(18,20,22,0.82) 100%);
  }
  .hero .content { position: relative; display: flex; flex-direction: column; gap: 16px; align-items: center; }

  @media (max-width: 700px) {
    .hero img.bg { object-position: 78% center; }
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-soft);
  }
  h1 {
    margin: 0;
    font-size: clamp(48px, 8vw, 92px);
    font-weight: 500;
    line-height: 1;
  }
  .dates {
    font-size: 19px;
    color: var(--text-soft);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="active">Peter</a>
  <a href="Bilder.html">Bilder</a>
  <a href="Musik.html">Musik</a>
</nav>

<div class="hero">
  <img class="bg" src="assets/peter-portrait.jpg" alt="Portrait von Peter Kinkelin">
  <div class="overlay"></div>
  <div class="content">
    <div class="eyebrow">In liebevoller Erinnerung</div>
    <h1 class="name">Peter Kinkelin</h1>
  </div>
</div>

</body>
</html>
